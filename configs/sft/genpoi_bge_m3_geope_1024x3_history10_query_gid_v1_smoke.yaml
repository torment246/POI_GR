### model
model_name_or_path: models/Qwen3-0.6B-GenPOI-Vocab-v1
trust_remote_code: false
resize_vocab: false

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: full

### fixed GenPOI smoke cache: first 10,000 Train + 2,000 Valid source rows
dataset: genpoi_bge_m3_geope_1024x3_history10_query_gid_v1_train
eval_dataset: genpoi_bge_m3_geope_1024x3_history10_query_gid_v1_valid
dataset_dir: configs/sft
tokenized_path: data/sft/tokenized/genpoi_bge_m3_geope_1024x3_history10_query_gid_v1/smoke
template: qwen3_nothink
enable_thinking: false
cutoff_len: 512
packing: true
train_on_prompt: false
dataloader_num_workers: 0

### output and recovery checkpoints
output_dir: outputs/sft/smoke/genpoi_bge_m3_geope_1024x3_history10_query_gid_v1
overwrite_output_dir: false
logging_strategy: steps
logging_steps: 1
logging_first_step: true
save_strategy: steps
save_steps: 10
save_total_limit: 2
save_only_model: false
save_safetensors: true
plot_loss: false
report_to: none

### train
max_steps: 20
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
optim: adamw_torch
weight_decay: 0.01
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
bf16: true
fp16: false
seed: 42
data_seed: 42
gradient_checkpointing: false
disable_gradient_checkpointing: true
include_tokens_per_second: true
include_num_input_tokens_seen: true
skip_memory_metrics: false

### validation
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10
load_best_model_at_end: false
predict_with_generate: false
compute_accuracy: false
