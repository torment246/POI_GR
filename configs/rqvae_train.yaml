seed: 42

data:
  text_embeddings_npy: data/embeddings/poi_text_embeddings.npy
  embedding_meta_parquet: data/embeddings/poi_embedding_meta.parquet
  geo_features_npy: data/geo/poi_geo_features.npy
  geo_meta_parquet: data/geo/poi_geo_meta.parquet
  rqvae_input_semantic_npy: data/rqvae/rqvae_input_semantic.npy
  rqvae_input_geo_fused_npy: data/rqvae/rqvae_input_geo_fused.npy

preprocess:
  text_pca_dim: 256
  geo_alpha: 0.1
  val_ratio: 0.05
  pca_random_state: 42

rqvae:
  encoder_hidden_dims: [512, 256]
  latent_dim: 64
  num_codebooks: 3
  codebook_size: 128
  commitment_beta: 0.25
  codebook_loss_weight: 1.0
  recon_loss: mse
  lr: 0.0005
  weight_decay: 0.000001
  batch_size: 1024
  epochs: 50
  early_stop_patience: 10
  num_workers: 2
  device: auto
  grad_clip_norm: 1.0

logging:
  log_every_steps: 50
  save_every_epochs: 5
