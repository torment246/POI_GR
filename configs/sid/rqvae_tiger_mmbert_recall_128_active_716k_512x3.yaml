data:
  embeddings: outputs/embeddings/beijing_poi_active_order14d_history10_mmbert_recall_128/embeddings.npy
  poi_ids: outputs/embeddings/beijing_poi_active_order14d_history10_mmbert_recall_128/poi_ids.jsonl
  embedding_manifest: outputs/embeddings/beijing_poi_active_order14d_history10_mmbert_recall_128/manifest.json
  poi_data: data/beijing_poi_active_order14d_history10_20260715_json
  finite_check_chunk_rows: 8192

model:
  input_dim: 128
  hidden_dim: 512
  latent_dim: 256
  rq_layers: 3
  codebook_loss_weight: 1.0
  commitment_loss_weight: 0.25

initialization:
  backend: faiss_gpu
  sample_scope: all
  sample_size: 716245
  iterations: 20
  batch_size: 8192
  max_points_per_centroid: 2048

training:
  seed: 42
  device: cuda
  batch_size: 4096
  block_rows: 32768
  max_epochs: 20
  early_stopping: false
  checkpoint_epochs: [20]
  validation_ratio: 0.01
  learning_rate: 0.0003
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  collapse_utilization_threshold: 0.01
  resume: true
  show_progress: true

evaluation:
  max_cases: 20
  max_pois_per_case: 20

output_root: outputs/sid/tiger/active_716k_mmbert_recall_128

experiments:
  TIGER-ACTIVE716K-MMBERT-RECALL-128-512x3-FULLINIT:
    codebook_sizes: [512, 512, 512]
