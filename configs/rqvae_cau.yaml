seed: 42

data:
  rqvae_input_semantic_npy: data/rqvae/rqvae_input_semantic.npy
  preprocess_semantic_pkl: outputs/rqvae/preprocess_semantic.pkl
  labels_parquet: outputs/experiments/cau_rqvae/labels/cau_coarse_category_labels.parquet
  vocab_json: outputs/experiments/cau_rqvae/labels/cau_category_vocab.json
  baseline_sid_mapping: data/sid/poi_sid_mapping_semantic.parquet
  init_checkpoint: outputs/rqvae/rqvae_semantic.pt

rqvae:
  encoder_hidden_dims: [512, 256]
  latent_dim: 64
  num_codebooks: 3
  codebook_size: 128
  commitment_beta: 0.25
  codebook_loss_weight: 1.0
  dropout: 0.05
  lr: 0.0005
  weight_decay: 0.000001
  batch_size: 1024
  epochs: 3
  early_stop_patience: 5
  device: auto
  grad_clip_norm: 1.0

cau:
  lambda_tag: 0.05
  lambda_unique: 0.05
  unique_margin: 0.70
  label_smoothing: 0.05
  classifier_dropout: 0.10
  collision_sample_rate: 0.25
  max_pairs_per_group_per_batch: 6
  loss_scale_check_epochs: 1
  tag_loss_ratio_range: [0.05, 0.20]
  unique_loss_ratio_range: [0.05, 0.15]

logging:
  log_every_steps: 50
  save_every_epochs: 1
